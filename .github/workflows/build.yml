name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      automate_home_branch:
        description: "automate-home branch to install"
        required: false
        default: "dev"
      automate_knx_branch:
        description: "automate-knx-plugin branch to install"
        required: false
        default: "dev"
      automate_lifx_branch:
        description: "automate-lifx-plugin branch to install"
        required: false
        default: "dev"
      automate_sonos_branch:
        description: "automate-sonos-plugin branch to install"
        required: false
        default: "dev"

env:
  AUTOMATE_HOME_BRANCH: ${{ github.event.inputs.automate_home_branch || github.base_ref || github.ref_name || 'dev' }}
  AUTOMATE_KNX_BRANCH: ${{ github.event.inputs.automate_knx_branch || github.base_ref || github.ref_name || 'dev' }}
  AUTOMATE_LIFX_BRANCH: ${{ github.event.inputs.automate_lifx_branch || github.base_ref || github.ref_name || 'dev' }}
  AUTOMATE_SONOS_BRANCH: ${{ github.event.inputs.automate_sonos_branch || github.base_ref || github.ref_name || 'dev' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install --force-reinstall git+https://github.com/majamassarini/automate-knx-plugin.git@${{ env.AUTOMATE_KNX_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-lifx-plugin.git@${{ env.AUTOMATE_LIFX_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-sonos-plugin.git@${{ env.AUTOMATE_SONOS_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-home.git@${{ env.AUTOMATE_HOME_BRANCH }}

      - name: black
        run: black --check .

      - name: flake8
        run: flake8 ws

      - name: mypy
        run: mypy ws

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install --force-reinstall git+https://github.com/majamassarini/automate-knx-plugin.git@${{ env.AUTOMATE_KNX_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-lifx-plugin.git@${{ env.AUTOMATE_LIFX_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-sonos-plugin.git@${{ env.AUTOMATE_SONOS_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-home.git@${{ env.AUTOMATE_HOME_BRANCH }}

      - name: Run unit tests
        run: |
          python -m coverage run -m unittest discover \
            -s ws/tests -p 'test*.py' -v
