<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.3/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="/static/homino.css?v=13">

    <title>{{ appliance.name }} history</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script type="text/javascript" src="/static/homino.js?v=2"></script>
</head>

<body>
<section class="section">
    <div class="container">

        {% include "navbar.html" %}

        <nav class="breadcrumb mt-4" aria-label="breadcrumbs">
            <ul>
                <li><a href="/collections">Collections</a></li>
                <li><a href="{{ collection_url }}">{{ collection }}</a></li>
                <li><a href="{{ appliance_uri }}">{{ appliance.name }}</a></li>
                <li class="is-active"><a>{{ _("history") }}</a></li>
            </ul>
        </nav>

        <h1 class="title is-5 mb-4">{{ appliance.name }}</h1>

        <div class="is-flex is-flex-wrap-wrap is-align-items-center mb-3" style="gap: 0.5rem;">
            {% for key, label in [("today", _("Today")), ("yesterday", _("Yesterday"))] %}
            <button class="button is-small {% if active_filter == key %}is-primary{% else %}is-light{% endif %}"
                    hx-get="{{ history_url }}?filter={{ key }}&offset=0&limit={{ limit }}"
                    hx-target="#history-results"
                    hx-swap="innerHTML">
                {{ label }}
            </button>
            {% endfor %}
            <!-- Custom date range -->
            <form style="display: inline-flex; align-items: center; gap: 0.35rem;"
                  hx-get="{{ history_url }}"
                  hx-target="#history-results"
                  hx-swap="innerHTML"
                  hx-include="[name='from_date'],[name='to_date']">
                <input type="hidden" name="filter" value="custom">
                <input type="hidden" name="offset" value="0">
                <input type="hidden" name="limit" value="{{ limit }}">
                <input class="input is-small {% if active_filter == 'custom' %}is-primary{% endif %}"
                       type="date" name="from_date"
                       value="{{ custom_from }}"
                       style="width: 9rem;">
                <span class="is-size-7 has-text-grey">–</span>
                <input class="input is-small {% if active_filter == 'custom' %}is-primary{% endif %}"
                       type="date" name="to_date"
                       value="{{ custom_to }}"
                       style="width: 9rem;">
                <button type="submit"
                        class="button is-small {% if active_filter == 'custom' %}is-primary{% else %}is-light{% endif %}">
                    <span class="icon is-small"><i class="ti ti-filter"></i></span>
                </button>
            </form>
        </div>
        <div id="history-results">
            {% include "history_partial.html" %}
        </div>

    </div>
</section>

</body>
</html>
