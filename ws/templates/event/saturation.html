{% include templates_dir + "/event/label.html" %}
<div class="column">
    {% if user.edit %}
    <input class="input" type="number" min="0" max="100" name="value" id="{{ bean.id }}" value="{{ bean.value }}"
           {% if not bean.enabled %} disabled {% endif %}>
    {% else %}
        {% include templates_dir + "/event/value_label.html" %}
    {% endif %}
</div>
