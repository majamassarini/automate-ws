<div class="column">
    {% if user.edit %}
    {% include templates_dir + "/event/label.html" %}
    <input class="input" type="number" name="value" id="{{ bean.id }}" value="{{ bean.value }}" {% if not bean.enabled %} disabled {% endif %}>
    {% else %}
    <span class="is-size-7">{% if bean.label %}<span class="has-text-grey mr-1">{{ _(bean.label) }}</span>{% endif %}<span id="{{ bean.id_label }}">{{ bean.value }}</span></span>
    {% endif %}
</div>
