<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.3/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="/static/homino.css?v=13">

    <title>{{ appliance.name }}</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-ws@2.0.2/ws.js"></script>
    <script type="text/javascript" src="/static/homino.js?v=2"></script>
</head>

<body>
<section class="section">
    <div class="container">

        {% include "navbar.html" %}

        <div class="is-flex is-justify-content-space-between is-align-items-center mt-4">
            <nav class="breadcrumb mb-0" aria-label="breadcrumbs">
                <ul>
                    <li><a href="/collections">{{ _("Collections") }}</a></li>
                    <li><a href="{{ collection_url }}">{{ collection }}</a></li>
                    <li class="is-active"><a>{{ appliance.name }}</a></li>
                </ul>
            </nav>
            <div class="buttons are-small mb-0">
                <button class="button is-light" title="{{ _('Copy appliance name') }}"
                        onclick="navigator.clipboard.writeText('{{ appliance.name }}')">
                    <span class="icon is-small"><i class="ti ti-copy"></i></span>
                </button>
                <a class="button is-light" href="{{ history_url }}">{{ _("history") }}</a>
                <a class="button is-light" href="{{ details_url }}">{{ _("details") }}</a>
            </div>
        </div>

        <div hx-ext="ws" ws-connect="/ws">
            {% include "appliance_partial.html" %}
        </div>

    </div>
</section>
</body>
</html>
