<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">

<g transform="translate(0.5, 3.49)">
  <!-- Connection stems (drawn behind nodes) -->

  <!-- Heaven → Earth (darkest, primary stem) -->
  <line x1="40" y1="13" x2="86" y2="67"
        stroke="#0a6fa8" stroke-width="3" stroke-linecap="round"/>

  <!-- Heaven → Human (medium weight) -->
  <line x1="40" y1="13" x2="13" y2="82"
        stroke="#209cee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Earth ↔ Human (faint, ground line) -->
  <line x1="86" y1="67" x2="13" y2="82"
        stroke="#209cee" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>

  <!-- ── Heaven node (primary hub, top-left) — flower ── -->
  <g stroke="#075a86" stroke-width="0.9" stroke-linejoin="round">
    <circle cx="40"     cy="20.15"  r="5.85" fill="#0a6fa8"/>
    <circle cx="33.2"   cy="15.209" r="5.85" fill="#0a6fa8"/>
    <circle cx="35.796" cy="7.216"  r="5.85" fill="#0a6fa8"/>
    <circle cx="44.204" cy="7.216"  r="5.85" fill="#0a6fa8"/>
    <circle cx="46.8"   cy="15.209" r="5.85" fill="#0a6fa8"/>
    <circle cx="40"     cy="13"     r="3.64" fill="#d9f0fd" stroke-width="0.7"/>
  </g>

  <!-- ── Earth node (spreading right, middle height) — flower ── -->
  <g stroke="#075a86" stroke-width="0.7" stroke-linejoin="round">
    <circle cx="86"     cy="72.363" r="4.388" fill="#0a6fa8"/>
    <circle cx="80.9"   cy="68.657" r="4.388" fill="#0a6fa8"/>
    <circle cx="82.847" cy="62.662" r="4.388" fill="#0a6fa8"/>
    <circle cx="89.153" cy="62.662" r="4.388" fill="#0a6fa8"/>
    <circle cx="91.1"   cy="68.657" r="4.388" fill="#0a6fa8"/>
    <circle cx="86"     cy="67"     r="2.73"  fill="#d9f0fd" stroke-width="0.55"/>
  </g>

  <!-- ── Human node (lower left) — flower ── -->
  <g stroke="#075a86" stroke-width="0.7" stroke-linejoin="round">
    <circle cx="13"     cy="87.363" r="4.388" fill="#0a6fa8"/>
    <circle cx="7.9"    cy="83.657" r="4.388" fill="#0a6fa8"/>
    <circle cx="9.847"  cy="77.662" r="4.388" fill="#0a6fa8"/>
    <circle cx="16.153" cy="77.662" r="4.388" fill="#0a6fa8"/>
    <circle cx="18.1"   cy="83.657" r="4.388" fill="#0a6fa8"/>
    <circle cx="13"     cy="82"     r="2.73"  fill="#d9f0fd" stroke-width="0.55"/>
  </g>
</g>

</svg>
